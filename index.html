<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para ti 🪻</title>
  <meta name="theme-color" content="#031024">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪻%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
:root{--navy:#031024;--sea:#0278ae}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;color:#fff;
  background:linear-gradient(180deg,var(--navy) 0%,var(--sea) 100%) fixed;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* Capas */
#fireflies{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:0;animation:fade 3s ease 1s forwards}
.scene{position:absolute;inset:0 0 14vh 0;z-index:1}
#art{display:block;width:100%;height:100%;overflow:visible}

/* Crecimiento inicial (se activa al poner la clase .go en .scene) */
.stem{stroke-dasharray:1;stroke-dashoffset:1}
.go .stem{animation:draw 2s cubic-bezier(.3,.7,.25,1) var(--d,0s) both}
.head,.leaf{transform-box:fill-box;transform:scale(0)}
.head{transform-origin:50% 50%}
.leaf{transform-origin:var(--o,0% 50%)}
.go .head{animation:bloom 1.8s cubic-bezier(.2,1.25,.4,1) var(--d,0s) both}
.go .leaf{animation:pop 1.2s cubic-bezier(.2,1.2,.4,1) var(--d,0s) both}
.go #dog{animation:rise 1.8s ease-out .2s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bloom{from{transform:scale(0) rotate(-80deg)}to{transform:scale(1) rotate(0)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(50px)}}
@keyframes fade{to{opacity:1}}

/* Movimiento continuo de las flores */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out var(--s,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}

/* Perrito: respiración, orejas, cola, pestañeo y ofrenda */
.breath{transform-origin:400px 560px;animation:breathe 3.6s ease-in-out infinite}
.noggin{animation:bob 3.6s ease-in-out infinite}
.ear-l{transform-origin:335px 215px;animation:earL 4s ease-in-out infinite}
.ear-r{transform-origin:465px 215px;animation:earR 4s ease-in-out .6s infinite}
.tail{transform-origin:505px 480px;animation:wag .9s ease-in-out infinite alternate}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.offer{transform-origin:400px 480px;animation:offer 3.2s ease-in-out 3s infinite}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes earL{50%{transform:rotate(-6deg)}}
@keyframes earR{50%{transform:rotate(6deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes offer{50%{transform:translateY(-7px) scale(1.035)}}

/* Mensaje */
.message{
  position:absolute;left:0;right:0;bottom:0;height:16vh;min-height:90px;z-index:3;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;
  background:linear-gradient(transparent,rgba(3,16,36,.8));
  opacity:0;animation:fade 3s ease 3.2s forwards;
}
.gold{
  margin:0;
  font-family:'Great Vibes','Brush Script MT','Segoe Script',cursive;
  font-size:clamp(2rem,6.5vw,4rem);line-height:1.15;
  background:linear-gradient(100deg,#ffb938 0%,#fff2b0 35%,#ffd45a 50%,#fff2b0 65%,#ffb938 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,200,80,.55));
  animation:shine 6s linear infinite;
}
.heart{-webkit-text-fill-color:initial;color:#ffd45a}
@keyframes shine{to{background-position:200% 0}}

@media (prefers-reduced-motion:reduce){
  .sway,.breath,.noggin,.ear-l,.ear-r,.tail,.offer,.gold{animation:none}
}

</style>
</head>
<body>
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <main>
    <div class="scene" id="scene">
      <svg id="art" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax meet" role="img"
           aria-label="Un perrito panzón entrega un ramo de flores moradas en un jardín nocturno con luciérnagas">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glowS" x="-40%" y="-20%" width="180%" height="140%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="gPetalOut" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#f57c00"/>
          </linearGradient>
          <linearGradient id="gPetalIn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff08a"/><stop offset="1" stop-color="#ffb000"/>
          </linearGradient>
          <radialGradient id="gCenter">
            <stop offset="0" stop-color="#1c0a04"/><stop offset=".6" stop-color="#5a2d0c"/><stop offset="1" stop-color="#8a4b12"/>
          </radialGradient>
          <linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1e6ff"/><stop offset="1" stop-color="#b79cf0"/>
          </linearGradient>
          <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#083541"/><stop offset="1" stop-color="#02101a"/>
          </linearGradient>
        </defs>

        <!-- Jardín (se genera desde script.js) -->
        <g id="garden"></g>
        <ellipse cx="400" cy="650" rx="1800" ry="100" fill="url(#gHill)"/>

        <!-- Perrito panzón -->
        <g id="dog">
          <ellipse cx="400" cy="560" rx="175" ry="20" fill="#000" opacity=".3"/>

          <g class="tail">
            <path d="M505 480 Q575 450 562 385" fill="none" stroke="#c98a4b" stroke-width="22" stroke-linecap="round"/>
          </g>

          <g class="breath">
            <ellipse cx="342" cy="540" rx="38" ry="22" fill="#f0c27b"/>
            <ellipse cx="458" cy="540" rx="38" ry="22" fill="#f0c27b"/>
            <ellipse cx="400" cy="440" rx="128" ry="112" fill="#f0c27b"/>
            <ellipse cx="400" cy="460" rx="100" ry="88" fill="#fff0d2"/>
          </g>

          <g class="noggin">
            <g class="ear-l"><ellipse cx="312" cy="262" rx="32" ry="60" transform="rotate(14 312 262)" fill="#c98a4b"/></g>
            <g class="ear-r"><ellipse cx="488" cy="262" rx="32" ry="60" transform="rotate(-14 488 262)" fill="#c98a4b"/></g>
            <ellipse cx="400" cy="270" rx="100" ry="90" fill="#f0c27b"/>
            <ellipse cx="400" cy="305" rx="52" ry="38" fill="#fff0d2"/>
            <ellipse cx="335" cy="295" rx="15" ry="8" fill="#ff8fa3" opacity=".5"/>
            <ellipse cx="465" cy="295" rx="15" ry="8" fill="#ff8fa3" opacity=".5"/>
            <g class="blink"><circle cx="362" cy="262" r="11" fill="#2a1a14"/><circle cx="359" cy="258" r="3.5" fill="#fff"/></g>
            <g class="blink"><circle cx="438" cy="262" r="11" fill="#2a1a14"/><circle cx="435" cy="258" r="3.5" fill="#fff"/></g>
            <ellipse cx="400" cy="288" rx="14" ry="10" fill="#2a1a14"/>
            <ellipse cx="396" cy="285" rx="4" ry="2.5" fill="#fff" opacity=".6"/>
            <path d="M400 298V308M400 308Q385 322 372 310M400 308Q415 322 428 310" fill="none" stroke="#2a1a14" stroke-width="3" stroke-linecap="round"/>
            <path d="M392 317Q400 338 408 317Z" fill="#ff8fa3"/>
          </g>

          <!-- Ramo de flores moradas -->
          <g class="offer">
            <ellipse cx="350" cy="418" rx="28" ry="9" transform="rotate(-28 350 418)" fill="#2fbf62"/>
            <ellipse cx="450" cy="418" rx="28" ry="9" transform="rotate(28 450 418)" fill="#2fbf62"/>
            <ellipse cx="372" cy="388" rx="24" ry="8" transform="rotate(-55 372 388)" fill="#27a856"/>
            <ellipse cx="428" cy="388" rx="24" ry="8" transform="rotate(55 428 388)" fill="#27a856"/>
            <path d="M338 424Q400 440 462 424L404 528Q400 532 396 528Z" fill="url(#gPaper)" stroke="#ffd1e6" stroke-opacity=".6"/>
            <path d="M372 430L400 520" stroke="#9b7be0" stroke-opacity=".5" fill="none"/>
            <g filter="url(#glowS)">
              <g class="head" style="--d:1.9s"><use href="#f-pansy" transform="translate(364,416) scale(.55)"/></g>
              <g class="head" style="--d:2.1s"><use href="#f-rose" transform="translate(436,416) scale(.6)"/></g>
              <g class="head" style="--d:2.3s"><use href="#f-clematis" transform="translate(400,392) scale(.6)"/></g>
            </g>
            <ellipse cx="385" cy="472" rx="16" ry="8" transform="rotate(-25 385 472)" fill="#ff6fa5"/>
            <ellipse cx="415" cy="472" rx="16" ry="8" transform="rotate(25 415 472)" fill="#ff6fa5"/>
            <circle cx="400" cy="472" r="6" fill="#ff4f8f"/>
            <path d="M322 430Q326 456 356 458" fill="none" stroke="#f0c27b" stroke-width="32" stroke-linecap="round"/>
            <path d="M478 430Q474 456 444 458" fill="none" stroke="#f0c27b" stroke-width="32" stroke-linecap="round"/>
            <circle cx="358" cy="458" r="19" fill="#f0c27b"/>
            <circle cx="442" cy="458" r="19" fill="#f0c27b"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="message">
      <p class="gold">Conmigo no serás espectadora <span class="heart">💛</span></p>
    </div>
  </main>

  <script>
'use strict';

const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function svgEl(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* ---------- Flores moradas: una especie distinta por símbolo (<use href="#f-nombre">) ---------- */
// Paleta: de violeta profundo a lila claro, más amarillo para los centros
const V = { d: '#5b2bb8', m: '#7b3fe4', v: '#8a4fe0', l: '#9b5de5', s: '#b388f5', p: '#d4b8ff', y: '#ffd54a' };
const rot = (a) => `rotate(${a})`;

const SPECIES = {
  // Jardín
  aster(g) {
    for (let i = 0; i < 24; i++)
      svgEl('ellipse', { cy: -34, rx: 4.5, ry: 22, fill: i % 2 ? V.l : V.s, transform: rot(i * 15) }, g);
    svgEl('circle', { r: 13, fill: V.y }, g);
    svgEl('circle', { r: 7, fill: '#ffb000' }, g);
  },
  tulip(g) {
    svgEl('ellipse', { cx: -15, cy: -6, rx: 17, ry: 36, fill: V.m, transform: 'rotate(-14 -15 -6)' }, g);
    svgEl('ellipse', { cx: 15, cy: -6, rx: 17, ry: 36, fill: V.m, transform: 'rotate(14 15 -6)' }, g);
    svgEl('ellipse', { cy: -2, rx: 18, ry: 40, fill: V.s }, g);
    svgEl('path', { d: 'M0 -38V22', stroke: V.p, 'stroke-opacity': 0.6, 'stroke-width': 2, fill: 'none' }, g);
  },
  hydrangea(g) {
    const c = [V.v, V.l, V.s, V.p];
    for (let i = 0; i < 36; i++) {
      const a = i * 2.39996, r = 7.2 * Math.sqrt(i);
      const f = svgEl('g', { transform: `translate(${Math.cos(a) * r},${Math.sin(a) * r})` }, g);
      svgEl('circle', { r: 9.5, fill: c[i % 4] }, f);
      svgEl('circle', { r: 2.2, fill: V.y, opacity: 0.8 }, f);
    }
  },
  bell(g) {
    svgEl('path', { d: 'M-22 -34 C-24 -6 -36 10 -44 28 Q-22 40 0 30 Q22 40 44 28 C36 10 24 -6 22 -34 Q0 -48 -22 -34Z', fill: V.v }, g);
    svgEl('path', { d: 'M-10 -34 C-10 -6 -16 12 -20 26 M10 -34 C10 -6 16 12 20 26', stroke: V.s, 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none', opacity: 0.7 }, g);
    svgEl('ellipse', { cy: 30, rx: 30, ry: 8, fill: V.d, opacity: 0.55 }, g);
    svgEl('ellipse', { cy: 36, rx: 4, ry: 10, fill: V.y }, g);
  },
  anemone(g) {
    for (let i = 0; i < 7; i++)
      svgEl('ellipse', { cy: -28, rx: 18, ry: 26, fill: i % 2 ? V.v : V.m, transform: rot(i * 51.43) }, g);
    svgEl('circle', { r: 15, fill: '#1c0a2e' }, g);
    for (let i = 0; i < 16; i++)
      svgEl('circle', { cx: Math.cos(i * 0.3927) * 20, cy: Math.sin(i * 0.3927) * 20, r: 1.8, fill: V.p }, g);
  },
  iris(g) {
    [-110, 110, 180].forEach((a) => {
      svgEl('ellipse', { cy: -28, rx: 16, ry: 27, fill: V.d, transform: rot(a) }, g);
      svgEl('ellipse', { cy: -16, rx: 2.6, ry: 9, fill: V.y, transform: rot(a) }, g);
    });
    [-35, 35, 0].forEach((a) =>
      svgEl('ellipse', { cy: -28, rx: 13, ry: 27, fill: a ? V.v : V.s, transform: rot(a) }, g));
  },
  lavender(g) {
    for (let i = 0; i < 10; i++) {
      const y = 10 - i * 9, k = 1 - i * 0.06;
      [-1, 1].forEach((d) =>
        svgEl('ellipse', {
          cx: d * 6 * k, cy: y, rx: 4.5 * k, ry: 8 * k, fill: i % 2 ? V.l : V.s,
          transform: `rotate(${d * 28} ${d * 6 * k} ${y})`,
        }, g));
    }
    svgEl('ellipse', { cy: -80, rx: 4, ry: 8, fill: V.l }, g);
  },
  thistle(g) {
    for (let i = 0; i < 21; i++)
      svgEl('ellipse', { cy: -24, rx: 2.8, ry: 26, fill: i % 2 ? '#a566ff' : V.m, transform: `rotate(${-84 + i * 8.4} 0 6)` }, g);
    svgEl('ellipse', { cy: 10, rx: 24, ry: 17, fill: '#3f7a52' }, g);
    svgEl('path', { d: 'M-20 4L20 16M-12 -4L24 10M12 -4L-24 10M20 4L-20 16', stroke: '#2a5a3a', 'stroke-width': 1.4, fill: 'none' }, g);
  },
  // Ramo
  clematis(g) {
    for (let i = 0; i < 6; i++) {
      svgEl('path', { d: 'M0 0C-17 -16 -15 -44 0 -64C15 -44 17 -16 0 0Z', fill: V.m, transform: rot(i * 60) }, g);
      svgEl('path', { d: 'M0 -8V-50', stroke: V.p, 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: 0.6, transform: rot(i * 60) }, g);
    }
    svgEl('circle', { r: 8, fill: '#f4e6ff' }, g);
    for (let i = 0; i < 10; i++)
      svgEl('circle', { cx: Math.cos(i * 0.628) * 12, cy: Math.sin(i * 0.628) * 12, r: 1.8, fill: V.y }, g);
  },
  pansy(g) {
    [[-16, -22, 20, 24, V.d], [16, -22, 20, 24, V.d], [-27, 4, 20, 19, V.v], [27, 4, 20, 19, V.v], [0, 26, 25, 22, V.s]]
      .forEach(([cx, cy, rx, ry, fill]) => svgEl('ellipse', { cx, cy, rx, ry, fill }, g));
    svgEl('ellipse', { cy: 6, rx: 11, ry: 14, fill: V.y, opacity: 0.85 }, g);
    svgEl('path', { d: 'M0 4V30M-8 8L-16 26M8 8L16 26', stroke: '#2a1450', 'stroke-width': 2, 'stroke-linecap': 'round', fill: 'none' }, g);
  },
  rose(g) {
    svgEl('circle', { r: 38, fill: V.d }, g);
    [[6, 22, 17, 19, V.m], [5, 14, 11, 12, V.v], [4, 8, 7, 8, V.l]].forEach(([n, d, rx, ry, fill]) => {
      for (let i = 0; i < n; i++)
        svgEl('ellipse', { cy: -d, rx, ry, fill, stroke: V.d, 'stroke-width': 1, transform: rot((i * 360) / n + n * 7) }, g);
    });
    svgEl('circle', { r: 6, fill: V.p }, g);
    svgEl('path', { d: 'M-4 1Q0 -5 4 0Q1 5 -2 2', stroke: V.m, fill: 'none', 'stroke-width': 1.5 }, g);
  },
};

function buildFlowerSymbols() {
  const defs = $('#art defs');
  for (const [name, draw] of Object.entries(SPECIES)) draw(svgEl('g', { id: `f-${name}` }, defs));
}

/* ---------- Jardín de flores que brotan (una especie distinta por tallo) ---------- */
function buildGarden() {
  const garden = $('#garden');
  const flowers = [
    { k: 'aster',     x: 30,  h: 200, s: 0.6 },  { k: 'tulip',    x: 90,  h: 300, s: 0.85 },
    { k: 'hydrangea', x: 190, h: 380, s: 1 },    { k: 'bell',     x: 245, h: 250, s: 0.75 },
    { k: 'anemone',   x: 555, h: 260, s: 0.75 }, { k: 'iris',     x: 612, h: 390, s: 1 },
    { k: 'lavender',  x: 715, h: 310, s: 0.9 },  { k: 'thistle',  x: 770, h: 210, s: 0.65 },
  ];
  const base = 592;

  flowers.forEach(({ k: kind, x, h, s }, i) => {
    const d = 0.3 + i * 0.25;
    const g = svgEl('g', { class: 'sway', filter: 'url(#glowS)' }, garden);
    g.style.setProperty('--s', `${-rnd(0, 5).toFixed(2)}s`);

    const stem = svgEl('path', {
      class: 'stem', pathLength: 1, fill: 'none', stroke: '#3be07f', 'stroke-linecap': 'round',
      'stroke-width': Math.max(4, 7 * s),
      d: `M${x} ${base}C${x - 14} ${base - h * 0.35} ${x + 14} ${base - h * 0.7} ${x} ${base - h}`,
    }, g);
    stem.style.setProperty('--d', `${d}s`);

    // Dos hojas curvas (izquierda y derecha)
    [[-1, 0.35], [1, 0.55]].forEach(([dir, at], n) => {
      const holder = svgEl('g', { transform: `translate(${x},${base - h * at}) scale(${s * dir},${s})` }, g);
      const leaf = svgEl('g', { class: 'leaf' }, holder);
      leaf.style.setProperty('--o', '0% 50%');
      leaf.style.setProperty('--d', `${d + 0.9 + n * 0.2}s`);
      svgEl('path', { d: 'M0 0C30-22 62-14 74 10C44 22 16 18 0 0Z', fill: '#2fd873', 'fill-opacity': 0.9 }, leaf);
    });

    // Flor con resplandor
    const top = svgEl('g', { transform: `translate(${x},${base - h})`, filter: 'url(#glow)' }, g);
    const head = svgEl('g', { class: 'head' }, top);
    head.style.setProperty('--d', `${d + 1.6}s`);
    svgEl('use', { href: `#f-${kind}`, transform: `scale(${s})` }, head);
  });
}

/* ---------- Luciérnagas doradas (Canvas) ---------- */
function startFireflies() {
  const c = $('#fireflies'), ctx = c.getContext('2d');
  let W, H, last = performance.now();
  const P = [];

  const spawn = (p, init) => {
    p.x = rnd(0, W); p.y = init ? rnd(0, H) : H + 10;
    p.r = rnd(1.2, 3.2); p.ph = rnd(0, 6.28); p.sp = rnd(0.5, 1.4);
    p.vy = -rnd(6, 22); p.vx = rnd(-6, 6);
    return p;
  };

  const resize = () => {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * d; c.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.max(28, Math.min(90, Math.round((W * H) / 15000)));
    while (P.length < n) P.push(spawn({}, true));
    P.length = n;
  };
  addEventListener('resize', resize);
  resize();

  const k = reduceMotion ? 0.3 : 1;
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05) * k;
    last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of P) {
      p.ph += dt * p.sp * 1.6;
      p.x += (p.vx + Math.sin(p.ph) * 14) * dt;
      p.y += p.vy * dt;
      if (p.y < -12) spawn(p);
      const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(p.ph * 1.7));
      const R = p.r * 7;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, `rgba(255,226,120,${a})`);
      g.addColorStop(0.25, `rgba(255,200,70,${a * 0.45})`);
      g.addColorStop(1, 'rgba(255,190,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(loop);
  })(last);
}

/* ---------- Inicio ---------- */
buildFlowerSymbols();
buildGarden();
startFireflies();
// Doble rAF para que el navegador pinte el estado inicial antes de animar el brote
requestAnimationFrame(() => requestAnimationFrame(() => $('#scene').classList.add('go')));

</script>
</body>
</html>
